name: Build & Deploy to cPanel

on:
  push:
    branches:
      - main
      - master

jobs:

  # ── Job 1: Build React app and deploy frontend ─────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist/ to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false

  # ── Job 2: Deploy PHP backend (runs in parallel with Job 1) ────────
  deploy-backend:
    name: Deploy PHP Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload petra-api/ to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./petra-api/
          server-dir: "${{ secrets.FTP_SERVER_DIR_API }}/"
          # Never upload or delete config/database.php — it lives on the server only
          exclude: |
            **/.git*
            **/.git*/**
            config/database.php
          dangerous-clean-slate: false
